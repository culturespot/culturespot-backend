name: Build

on:
  push:
    branches:
      - dev
      - 'feature/*'
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: ▶️ Checkout Repository
        uses: actions/checkout@v4

      # JDK 17 설정
      - name: ▶️ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      # Gradle 설정
      - name: ▶️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Gradle 빌드
      - name: ▶️ Build with Gradle
        run: |
          ./gradlew clean 
          ./gradlew build --parallel -x test

      # 빌드 후 PEM 파일 삭제 (선택)
      - name: 🔐 Delete PEM files
        run: |
          rm -f ./CultureSpot-Domain/src/main/resources/private.pem
          rm -f ./CultureSpot-Domain/src/main/resources/public.pem

      - name: ▶️ Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ▶️ Build Docker image for batch module
        run: docker build -t ghcr.io/${{ github.repository }}/batch:spearkkk -f ./CultureSpot-Batch/Dockerfile .

      - name: ▶️ Push Docker image for batch module
        run: docker push ghcr.io/${{ github.repository }}/batch:spearkkk

      - name: ▶️ Build Docker image for api module
        run: docker build -t ghcr.io/${{ github.repository }}/api:spearkkk -f ./CultureSpot-ServiceApi/Dockerfile .

      - name: ▶️ Push Docker image for api module
        run: docker push ghcr.io/${{ github.repository }}/api:spearkkk
