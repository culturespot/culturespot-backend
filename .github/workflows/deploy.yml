name: Deploy

on:
  workflow_run:
    workflows: [ "Build" ]
    branches: [ dev, 'feature/*' ]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: ▶️ Checkout Repository
        uses: actions/checkout@v4

      - name: ▶️ Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEV_AWS_PUBLIC_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            echo "🔐 EC2 접속 완료"

            # GHCR 로그인
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            # ✅ 공통 네트워크 생성 (이미 있다면 에러 없이 넘어감)
            docker network create culture-network || true

            # ✅ 1. MySQL 컨테이너 정리 및 실행
            docker rm -f culture-mysql || true
            docker run -d --name culture-mysql --network culture-network \
              -e MYSQL_ROOT_PASSWORD=culturespot \
              -e MYSQL_DATABASE=culturespot \
              -p 3306:3306 \
              -v mysql_data:/var/lib/mysql \
              mysql:8.0

            echo "⏳ MySQL 초기화 대기 중..."
            sleep 15

            docker ps -a

            # ✅ 2. 배치 서버 정리 및 실행
            docker rm -f culture-spot-batch || true
            docker pull ghcr.io/${{ github.repository }}/batch:latest
            docker run -d --name culture-spot-batch --network culture-network \
              --env-file /home/ubuntu/app/env/domain-module.env \
              ghcr.io/${{ github.repository }}/batch:latest

            # ✅ 3. API 서버 정리 및 실행
            docker rm -f culture-spot-api || true
            docker pull ghcr.io/${{ github.repository }}/api:latest
            docker run -d -p 8080:8080 --name culture-spot-api --network culture-network \
              --env-file /home/ubuntu/app/env/domain-module.env \
              -e SPRING_PROFILE=dev \
              ghcr.io/${{ github.repository }}/api:latest

            echo "🚀 모든 컨테이너 실행 완료"
            docker ps -a
