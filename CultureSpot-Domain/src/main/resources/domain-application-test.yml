spring:
  datasource:
    url: jdbc:h2:mem:culturesport_test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.H2Dialect   # ✅ 이 부분 추가

  sql:
    init:
      mode: always
      data-locations:
        - ${H2_INIT_DML_SQL_PATH}
